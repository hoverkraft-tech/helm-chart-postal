---
# Prepare committed chart versions, validate the dispatched tag, then publish.
name: Release

on: # yamllint disable-line rule:truthy
  # checkov:skip=CKV_GHA_7: Force overrides only the no-change plan, never validation or publication checks.
  workflow_dispatch:
    inputs:
      force:
        description: Release even without changes
        type: boolean
        default: false
  schedule:
    - cron: "25 8 * * 1"

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    uses: hoverkraft-tech/ci-github-container/.github/workflows/prepare-chart-release.yml@a5dc1ea7c1f4c2dffc3267c5be7304d01284f2ec # 4.2.1
    permissions:
      actions: write
      contents: write
      pull-requests: read
    with:
      path: postal
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      github-app-client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
    secrets:
      github-app-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}

  validate:
    needs: prepare
    if: needs.prepare.outputs.status == 'ready'
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      upload-artifact: true

  release:
    name: Publish validated chart and GitHub release
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      pull-requests: read
    steps:
      - name: Publish and sign validated archive
        id: publish
        uses: hoverkraft-tech/ci-github-container/actions/helm/release-chart@a5dc1ea7c1f4c2dffc3267c5be7304d01284f2ec # 4.2.1
        with:
          artifact-id: ${{ needs.validate.outputs.artifact-id }}
          archive-name: ${{ needs.validate.outputs.archive-name }}
          checksum: ${{ needs.validate.outputs.checksum }}
          oci-repository: ${{ github.repository }}/charts/postal

      - uses: hoverkraft-tech/ci-github-publish/actions/release/create@bf24f894f60a3def62a8750f3964d05acb052c11 # 3.1.2
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          target-ref: ${{ github.sha }}
          changelog-summary: ${{ secrets.CHANGELOG_SUMMARY }}
