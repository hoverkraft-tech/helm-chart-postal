---
name: Shared - Continuous Integration for common tasks

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      upload-artifact:
        description: Preserve the validated chart for publication
        type: boolean
        default: false
    outputs:
      artifact-id:
        description: Immutable artifact ID of the validated chart
        value: ${{ jobs.tests-charts.outputs.artifact-id }}
      archive-name:
        description: Validated chart archive basename
        value: ${{ jobs.tests-charts.outputs.archive-name }}
      checksum:
        description: SHA-256 of the validated chart archive
        value: ${{ jobs.tests-charts.outputs.checksum }}

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@f165c0ca3e88604611481e1408ace1e0e3a5ee47 # 4.3.1
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  tests-charts:
    name: Tests - Charts
    uses: hoverkraft-tech/ci-github-container/.github/workflows/helm-chart-ci.yml@a5dc1ea7c1f4c2dffc3267c5be7304d01284f2ec # 4.2.1
    permissions:
      contents: read
      packages: read
    with:
      path: postal
      name: helm-chart-postal
      upload-artifact: ${{ inputs.upload-artifact }}
      helm-repositories: |
        bitnami https://charts.bitnami.com/bitnami
        jetstack https://charts.jetstack.io
      helm-set: |
        cert-manager.enabled=true
